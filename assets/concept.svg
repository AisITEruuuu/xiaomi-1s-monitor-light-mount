<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .metal { fill: #dbe4ec; stroke: #334155; stroke-width: 3; }
      .base { fill: #f59e0b; stroke: #92400e; stroke-width: 3; }
      .lamp { fill: #1e293b; stroke: #0f172a; stroke-width: 3; }
      .glass { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; }
      .dim { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="label title" x="55" y="55">Xiaomi 1S Monitor Light Mount - Concept</text>
  <text class="label small" x="55" y="82">Keep the original magnetic/power base intact. Build a mock monitor top edge.</text>

  <g transform="translate(55,115)">
    <rect class="panel" x="0" y="0" width="565" height="580" rx="12"/>
    <text class="label head" x="28" y="42">Primary: VESA mount</text>

    <rect class="metal" x="55" y="330" width="32" height="150"/>
    <rect class="metal" x="84" y="118" width="32" height="220"/>
    <rect class="metal" x="84" y="118" width="190" height="24"/>
    <rect class="metal" x="250" y="88" width="30" height="78"/>

    <rect class="glass" x="140" y="190" width="22" height="205"/>
    <rect class="lamp" x="210" y="42" width="130" height="22" rx="8"/>
    <path class="base" d="M244 64 L244 88 L266 88 L266 64 Z"/>

    <line class="dim" x1="280" y1="92" x2="280" y2="185"/>
    <text class="label body" x="292" y="144">Dummy top edge</text>
    <text class="label small" x="292" y="164">12-18 mm front/back</text>

    <line class="dim" x1="72" y1="300" x2="122" y2="300"/>
    <text class="label small" x="48" y="292">VESA</text>

    <text class="label body" x="360" y="214">1. VESA sandwich plate</text>
    <text class="label body" x="360" y="244">2. Rear riser</text>
    <text class="label body" x="360" y="274">3. Forward bridge</text>
    <text class="label body" x="360" y="304">4. Mock screen edge</text>
    <text class="label body" x="360" y="334">5. Original Xiaomi base</text>
    <text class="label body" x="360" y="364">6. USB-C cable path</text>

    <text class="label small" x="28" y="540">Light follows monitor tilt and height. Best optical stability.</text>
  </g>

  <g transform="translate(660,115)">
    <rect class="panel" x="0" y="0" width="565" height="580" rx="12"/>
    <text class="label head" x="28" y="42">Secondary: monitor-arm pole</text>

    <rect class="metal" x="62" y="105" width="24" height="370"/>
    <rect class="metal" x="62" y="188" width="180" height="18"/>
    <rect class="metal" x="224" y="158" width="28" height="78"/>
    <rect class="metal" x="224" y="158" width="100" height="18"/>
    <rect class="metal" x="305" y="128" width="28" height="68"/>

    <rect class="lamp" x="250" y="76" width="130" height="22" rx="8"/>
    <path class="base" d="M292 98 L292 122 L314 122 L314 98 Z"/>

    <circle cx="74" cy="220" r="26" fill="none" stroke="#b45309" stroke-width="6"/>
    <text class="label body" x="110" y="225">Locking pole clamp</text>
    <text class="label small" x="110" y="245">Measure Ø, 35 mm is common</text>

    <text class="label body" x="340" y="196">Rigid friction arm</text>
    <text class="label small" x="340" y="216">No soft unloaded ball head</text>

    <text class="label body" x="340" y="272">Mock screen edge</text>
    <text class="label body" x="340" y="302">Original Xiaomi base</text>
    <text class="label body" x="340" y="332">Safety tether</text>

    <text class="label small" x="28" y="540">More adjustable, but easier to misalign and vibrate.</text>
  </g>
</svg>

